<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدير المالي الشخصي</title>

<style>
body{font-family:Tajawal,Arial;background:#f4f6f8;margin:0}
header{background:#1e88e5;color:#fff;padding:15px;text-align:center;font-size:22px}
.nav{display:flex}
.nav button{flex:1;padding:12px;border:none;background:#1565c0;color:#fff;font-size:16px}
.nav button.active{background:#1e88e5}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1e88e5;color:#fff;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center}
th{background:#f5f5f5}
.actionBtn{padding:4px 8px;border-radius:6px;font-size:14px}
.editBtn{background:#ffb300}
.payBtn{background:#2e7d32}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<header>المدير المالي الشخصي</header>

<div class="nav">
<button class="active" onclick="showSection('finance')">العمليات</button>
<button onclick="showSection('debts')">الديون</button>
<button onclick="showSection('archive')">الأرشيف</button>
</div>

<div class="container">

<!-- العمليات -->
<div id="finance">

<div class="card">
<select id="type" onchange="updateCategory()">
<option value="income">دخل</option>
<option value="expense">خرج</option>
</select>

<select id="category"></select>
<input id="desc" placeholder="الوصف">
<input id="amount" type="number" placeholder="المبلغ">
<button onclick="addTransaction()">إضافة عملية</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>النوع</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>التاريخ</th><th>تعديل</th>
</tr>
</thead>
<tbody id="transactionList"></tbody>
</table>
</div>

<button onclick="instantClear()">ترحيل لحظي</button>
<button onclick="exportFinancePDF()">تصدير PDF</button>
</div>

<!-- الديون -->
<div id="debts" style="display:none">
<div class="card">
<input id="debtor" placeholder="الاسم">
<input id="debtAmount" type="number" placeholder="المبلغ">
<select id="debtType">
<option value="owedToYou">مدين لك</option>
<option value="youOwe">أنت مدين</option>
</select>
<button onclick="addDebt()">إضافة دين</button>
</div>

<div class="card">
<table>
<thead><tr><th>الاسم</th><th>المبلغ</th><th>النوع</th><th>سداد</th></tr></thead>
<tbody id="debtList"></tbody>
</table>
</div>

<button onclick="exportDebtPDF()">تصدير PDF</button>
</div>

<!-- الأرشيف -->
<div id="archive" style="display:none">
<select id="archiveSelect" onchange="renderArchive()"></select>
<table>
<tbody id="archiveList"></tbody>
</table>
<button onclick="exportArchivePDF()">تصدير PDF</button>
</div>

</div>

<script>
let transactions=JSON.parse(localStorage.getItem('financeData'))||[];
let debtData=JSON.parse(localStorage.getItem('debtData'))||[];
let archiveData=JSON.parse(localStorage.getItem('archiveData'))||[];

function showSection(s){
finance.style.display=s==='finance'?'block':'none';
debts.style.display=s==='debts'?'block':'none';
archive.style.display=s==='archive'?'block':'none';
}

function updateCategory(){
category.innerHTML='';
(type.value==='income'?['راتب','نقدي','بنكي','دين']:['مصروفات شخصية','مصروفات عائلية','فواتير','دين'])
.forEach(c=>category.innerHTML+=`<option>${c}</option>`);
}
updateCategory();

function addTransaction(){
transactions.push({type:type.value,category:category.value,desc:desc.value,amount:+amount.value,date:new Date().toLocaleDateString('ar-EG')});
save();
}

function editTransaction(i){
const t=transactions[i];
const n=prompt('الوصف',t.desc); if(n===null)return;
const a=prompt('المبلغ',t.amount); if(a===null)return;
t.desc=n; t.amount=+a; save();
}

function renderTransactions(){
transactionList.innerHTML='';
transactions.forEach((t,i)=>{
transactionList.innerHTML+=`
<tr>
<td>${t.type==='income'?'دخل':'خرج'}</td>
<td>${t.category}</td>
<td>${t.desc}</td>
<td>${t.amount}</td>
<td>${t.date}</td>
<td><button class="actionBtn editBtn" onclick="editTransaction(${i})">تعديل</button></td>
</tr>`;
});
}

function addDebt(){
const d={debtor:debtor.value,amount:+debtAmount.value,type:debtType.value,date:new Date().toLocaleDateString('ar-EG')};
debtData.push(d);

// إضافة تلقائية للعمليات
transactions.push({
type:d.type==='owedToYou'?'expense':'income',
category:'دين',
desc:`دين ${d.debtor}`,
amount:d.amount,
date:d.date
});

save(); renderDebts();
}

function renderDebts(){
debtList.innerHTML='';
debtData.forEach((d,i)=>{
debtList.innerHTML+=`
<tr>
<td>${d.debtor}</td>
<td>${d.amount}</td>
<td>${d.type==='owedToYou'?'مدين لك':'أنت مدين'}</td>
<td><button class="actionBtn payBtn" onclick="payDebt(${i})">سداد</button></td>
</tr>`;
});
}

function payDebt(i){
const d=debtData[i];
const p=+prompt('المبلغ');
if(!p)return;
transactions.push({
type:d.type==='owedToYou'?'income':'expense',
category:d.type==='owedToYou'?'سداد ديون':'ديون مسددة',
desc:`سداد ${d.debtor}`,
amount:p,
date:new Date().toLocaleDateString('ar-EG')
});
d.amount-=p;
if(d.amount<=0) debtData.splice(i,1);
save(); renderDebts();
}

function instantClear(){
if(!confirm('هل أنت متأكد من الترحيل؟')) return;
archiveData.push({date:new Date(),transactions:[...transactions]});
transactions=[];
save();
}

function save(){
localStorage.setItem('financeData',JSON.stringify(transactions));
localStorage.setItem('debtData',JSON.stringify(debtData));
localStorage.setItem('archiveData',JSON.stringify(archiveData));
renderTransactions();
}

renderTransactions(); renderDebts();
</script>

</body>
</html>
