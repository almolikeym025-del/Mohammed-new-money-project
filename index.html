<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدير المالي الشخصي - احترافي</title>

<style>
body{font-family:Tajawal,Arial;background:#f4f6f8;margin:0}
header{background:#1e88e5;color:#fff;padding:15px;text-align:center;font-size:22px}
.nav{display:flex}
.nav button{flex:1;padding:12px;border:none;background:#1565c0;color:#fff;font-size:16px}
.nav button.active{background:#1e88e5}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1e88e5;color:#fff;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:center}
th{background:#f5f5f5}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.box{flex:1;background:#e3f2fd;padding:10px;border-radius:10px;text-align:center}
.income{color:#2e7d32;font-weight:bold}
.expense{color:#c62828;font-weight:bold}
.warning{background:#fff3e0}
.actionBtn{margin:2px;padding:4px 8px;font-size:14px;border-radius:6px;}
.editBtn{background:#ffb300;}
.deleteBtn{background:#c62828;}
.payBtn{background:#2e7d32;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<header>المدير المالي الشخصي - احترافي</header>

<div class="nav">
<button id="financeBtn" class="active" onclick="showSection('finance')">العمليات</button>
<button id="debtBtn" onclick="showSection('debts')">الديون</button>
<button id="archiveBtn" onclick="showSection('archive')">الأرشيف</button>
</div>

<div class="container">

<!-- العمليات -->
<div id="finance">

<div class="card">
<select id="type" onchange="updateCategory()">
<option value="income">دخل</option>
<option value="expense">خرج</option>
</select>

<select id="category"></select>

<input id="desc" placeholder="الوصف">
<input id="amount" type="number" placeholder="المبلغ">
<button id="addBtn" onclick="addTransaction()">إضافة عملية</button>
</div>

<div class="card warning">
<h4>تصفية وترحيل المصروفات والدخل</h4>
<p>يمكنك ترحيل العمليات الشهرية أو اللحظية وحساب الفارق.</p>
<button onclick="closeMonth()">ترحيل الشهر</button>
<button onclick="instantClear()">ترحيل لحظي</button>
</div>

<div class="card">
<table>
<thead>
<tr><th>النوع</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>التاريخ</th></tr>
</thead>
<tbody id="transactionList"></tbody>
</table>
</div>

<div class="summary">
<div class="box income">الدخل<br><span id="totalIncome">0</span></div>
<div class="box expense">الخرج<br><span id="totalExpense">0</span></div>
<div class="box">الرصيد<br><span id="balance">0</span></div>
</div>

<button onclick="exportFinancePDF()">تصدير كشف العمليات PDF</button>
</div>

<!-- الديون -->
<div id="debts" style="display:none">

<div class="card">
<input id="debtor" placeholder="الاسم / الجهة">
<input id="debtAmount" type="number" placeholder="المبلغ">
<select id="debtType">
<option value="owedToYou">مدين لك</option>
<option value="youOwe">أنت مدين</option>
</select>
<button onclick="addDebt()">إضافة دين</button>
</div>

<div class="card">
<table>
<thead><tr><th>الاسم</th><th>المبلغ</th><th>النوع</th><th>التاريخ</th><th>الإجراءات</th></tr></thead>
<tbody id="debtList"></tbody>
</table>
</div>

<button onclick="exportDebtPDF()">تصدير كشف الديون PDF</button>
</div>

<!-- الأرشيف -->
<div id="archive" style="display:none">

<div class="card">
<h4>الأشهر المؤرشفة</h4>
<select id="archiveSelect" onchange="renderArchive()">
<option value="">اختر شهر</option>
</select>
</div>

<div class="card">
<table>
<thead><tr><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
<tbody id="archiveList"></tbody>
</table>
</div>

<button onclick="exportArchivePDF()">تصدير الشهر المؤرشف PDF</button>
<button onclick="clearArchive()">حذف الأرشيف بالكامل</button>
</div>

</div>

<script>
let transactions = JSON.parse(localStorage.getItem('financeData')) || [];
let debtData = JSON.parse(localStorage.getItem('debtData')) || [];
let archiveData = JSON.parse(localStorage.getItem('archiveData')) || [];

/* ===== التنقل بين الصفحات ===== */
function showSection(s){
finance.style.display=s==='finance'?'block':'none';
debts.style.display=s==='debts'?'block':'none';
archive.style.display=s==='archive'?'block':'none';
financeBtn.classList.toggle('active',s==='finance');
debtBtn.classList.toggle('active',s==='debts');
archiveBtn.classList.toggle('active',s==='archive');
}

/* ===== فئات العمليات حسب النوع ===== */
function updateCategory(){
  const typeVal = type.value;
  category.innerHTML = '';
  if(typeVal === 'income'){
    ['راتب','نقدي','بنكي'].forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      category.appendChild(opt);
    });
  } else {
    ['مصروفات شخصية','مصروفات عائلية','فواتير'].forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      category.appendChild(opt);
    });
  }
}
updateCategory();

/* ===== العمليات ===== */
function addTransaction(){
if(!desc.value || amount.value<=0) return;
transactions.push({
type:type.value,
category:category.value,
desc:desc.value,
amount:+amount.value,
date:new Date().toLocaleDateString('ar-EG')
});
desc.value=''; amount.value='';
saveTransactions();
}

function renderTransactions(){
transactionList.innerHTML='';
let inc=0,exp=0;
transactions.forEach((t)=>{
transactionList.innerHTML+=`
<tr>
<td>${t.type==='income'?'دخل':'خرج'}</td>
<td>${t.category}</td>
<td>${t.desc}</td>
<td>${t.amount}</td>
<td>${t.date}</td>
</tr>`;
t.type==='income'?inc+=t.amount:exp+=t.amount;
});

// الملخص المالي بالألوان
totalIncome.textContent=inc; totalIncome.style.color='#2e7d32';
totalExpense.textContent=exp; totalExpense.style.color='#c62828';
const bal = inc-exp;
balance.textContent=bal;
if(bal>0) balance.style.color='#2e7d32';
else if(bal<0) balance.style.color='#c62828';
else balance.style.color='#000';
}

/* ===== حفظ ===== */
function saveTransactions(){
localStorage.setItem('financeData',JSON.stringify(transactions));
renderTransactions();
}

/* ===== الديون ===== */
function addDebt(){
if(!debtor.value || debtAmount.value<=0) return;
debtData.push({
debtor:debtor.value,
amount:+debtAmount.value,
type:debtType.value,
date:new Date().toLocaleDateString('ar-EG')
});
localStorage.setItem('debtData',JSON.stringify(debtData));
debtor.value=''; debtAmount.value='';
renderDebts();
}

function renderDebts(){
debtList.innerHTML='';
debtData.forEach((d,i)=>{
debtList.innerHTML+=`
<tr>
<td>${d.debtor}</td>
<td>${d.amount}</td>
<td>${d.type==='owedToYou'?'مدين لك':'أنت مدين'}</td>
<td>${d.date}</td>
<td>
<button class="actionBtn editBtn" onclick="editDebt(${i})">تعديل</button>
<button class="actionBtn deleteBtn" onclick="deleteDebt(${i})">حذف</button>
<button class="actionBtn payBtn" onclick="payDebt(${i})">سداد</button>
</td>
</tr>`;
});
}

function payDebt(i){
const d = debtData[i];
const payAmount = prompt(`المبلغ المراد سداده (الرصيد الحالي: ${d.amount}):`, d.amount);
if(payAmount!==null && !isNaN(payAmount)){
    if(+payAmount >= d.amount){
        if(d.type==='owedToYou'){
            transactions.push({type:'income',category:'سداد ديون',desc:`سداد ${d.debtor}`,amount:d.amount,date:new Date().toLocaleDateString('ar-EG')});
        } else {
            transactions.push({type:'expense',category:'ديون مسددة',desc:`سداد دين لـ ${d.debtor}`,amount:d.amount,date:new Date().toLocaleDateString('ar-EG')});
        }
        debtData.splice(i,1);
    } else {
        d.amount -= +payAmount;
        if(d.type==='owedToYou'){
            transactions.push({type:'income',category:'سداد ديون',desc:`سداد ${d.debtor}`,amount:+payAmount,date:new Date().toLocaleDateString('ar-EG')});
        } else {
            transactions.push({type:'expense',category:'ديون مسددة',desc:`سداد دين لـ ${d.debtor}`,amount:+payAmount,date:new Date().toLocaleDateString('ar-EG')});
        }
    }
    localStorage.setItem('debtData',JSON.stringify(debtData));
    saveTransactions();
    renderDebts();
}
}

/* ===== ترحيل الشهر مع الرصيد ===== */
function closeMonth(){
if(!confirm('هل تريد ترحيل كل العمليات وحساب الفارق؟')) return;

const now = new Date();
const m = now.getMonth()+1;
const y = now.getFullYear();

const monthTransactions = [...transactions];
if(monthTransactions.length===0) return alert('لا توجد عمليات لترحيلها لهذا الشهر');

let totalIncomeMonth=0, totalExpenseMonth=0;
monthTransactions.forEach(t=>{
if(t.type==='income') totalIncomeMonth+=t.amount;
else totalExpenseMonth+=t.amount;
});

const diff = totalIncomeMonth - totalExpenseMonth;

archiveData.push({month:m,year:y,transactions:monthTransactions,totalIncome:totalIncomeMonth,totalExpense:totalExpenseMonth,balance:diff});

// مسح العمليات الحالية
transactions=[];

// إضافة الرصيد المتبقي للشهر التالي
if(diff!==0){
const nextDate = new Date(); nextDate.setMonth(nextDate.getMonth()+1);
if(diff>0){
transactions.push({type:'income',category:'رصيد متبقي',desc:`رصيد متبقي من الشهر ${m}/${y}`,amount:diff,date:nextDate.toLocaleDateString('ar-EG')});
} else {
transactions.push({type:'expense',category:'رصيد باقي',desc:`رصيد باقي من الشهر ${m}/${y}`,amount:Math.abs(diff),date:nextDate.toLocaleDateString('ar-EG')});
}
}

localStorage.setItem('financeData',JSON.stringify(transactions));
localStorage.setItem('archiveData',JSON.stringify(archiveData));
updateArchiveSelect();
renderTransactions();

alert(`تم ترحيل الشهر بنجاح!\nالدخل: ${totalIncomeMonth}\nالمصروف: ${totalExpenseMonth}\nالرصيد: ${diff}`);
}

/* ===== تصدير PDF مع الملخص ===== */
async function loadFontArabic(doc){
  try{
    const fontUrl='NotoNaskhArabic-Regular.ttf';
    const response=await fetch(fontUrl);
    const arrayBuffer=await response.arrayBuffer();
    const bytes=new Uint8Array(arrayBuffer);
    let binary=''; bytes.forEach(b=>binary+=String.fromCharCode(b));
    const base64=btoa(binary);
    doc.addFileToVFS('NotoNaskhArabic-Regular.ttf',base64);
    doc.addFont('NotoNaskhArabic-Regular.ttf','arabic','normal');
    doc.setFont('arabic');
  } catch(e){ alert('خطأ في تحميل الخط العربي'); }
}

async function exportFinancePDF(){
const { jsPDF }=window.jspdf;
const doc=new jsPDF('p','pt','a4');
await loadFontArabic(doc);
doc.setFontSize(16);
doc.text('كشف العمليات المالية', 40, 40);
doc.autoTable({
startY:60,
head:[['التاريخ','النوع','الفئة','الوصف','المبلغ']],
body:transactions.map(t=>[t.date,t.type==='income'?'دخل':'خرج',t.category,t.desc,t.amount]),
styles:{font:'arabic',halign:'right'}
});
const finalY=doc.lastAutoTable.finalY+20;
doc.text(`الدخل: ${totalIncome.textContent}`,40,finalY);
doc.text(`الخرج: ${totalExpense.textContent}`,150,finalY);
doc.text(`الرصيد: ${balance.textContent}`,280,finalY);
doc.save('العمليات.pdf');
}

/* ===== الأرشيف ===== */
function updateArchiveSelect(){
archiveSelect.innerHTML='<option value="">اختر شهر</option>';
archiveData.forEach((a,i)=>{
archiveSelect.innerHTML+=`<option value="${i}">${a.month}/${a.year}</option>`;
});
}

function renderArchive(){
archiveList.innerHTML='';
const i=archiveSelect.value;
if(i==='') return;
const a = archiveData[i];
a.transactions.forEach(t=>{
archiveList.innerHTML+=`<tr><td>${t.category}</td><td>${t.desc}</td><td>${t.amount}</td><td>${t.date}</td></tr>`;
});
archiveList.innerHTML+=`<tr><td colspan="4">الدخل: ${a.totalIncome} | المصروف: ${a.totalExpense} | الرصيد: ${a.balance}</td></tr>`;
}

/* ===== حذف الأرشيف ===== */
function clearArchive(){
if(!confirm('هل تريد حذف كل الأرشيف؟')) return;
archiveData=[];
localStorage.removeItem('archiveData');
updateArchiveSelect();
archiveList.innerHTML='';
}

/* ===== تحميل عند التشغيل ===== */
renderTransactions();
renderDebts();
updateArchiveSelect();
</script>

</body>
</html>
